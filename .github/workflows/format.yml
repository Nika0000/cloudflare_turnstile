name: Format

on:
  push:
    branches: [legacy]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: dart format .

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: format code"
          title: "style: format code"
          body: Auto-generated by the format workflow.
          branch: auto/format
          delete-branch: true
